# TFP copy bans from TFP-COPY-SPEC.md (section 6.0 and 7). They are ADDED to the shared floor in app/validator.py (dashes, greetings, sign-offs,
# markdown, preambles). Generated by scripts/gen_tfp_prompts.py. Literal strings avoid backslash escapes.

[[banned]]
name = "spam-trigger words (deliverability list in the spec)"
pattern = '(?i)(?<![A-Za-z])(bank|credit|billing|finance|financial|insurance|mortgage|urgent|investment|diagnostics|cash|invoice|purchase|free|quote|promise|guarantee|guaranteed|earn|click|discount|bonus|thousands|immediately|amazing|fantastic|the best)(?![A-Za-z])'

[[banned]]
name = "banned phrases and filler"
pattern = '(?i)(hope this finds you well|i wanted to reach out|i noticed|i saw|leverage|synergy|optimi[sz]e|streamline|scale|pain points|best-in-class|industry-leading|innovative|cutting-edge|robust|seamless(ly)?|game-changing|trusted by|leading companies|circle back|touch base|just following up|bumping|checking in|circling back|following up|in case you missed|quick (call|question|chat)|tragic|horrific|devastating|guaranteed compliant|certified)'

[[banned]]
name = "no dash characters: spaced hyphen or double hyphen"
pattern = '\s-\s|--'

[[banned]]
name = "no colon in the opening line"
pattern = '\A[^\n]{0,200}:'

[[banned]]
name = "at most one exclamation point"
pattern = '(?s)!.*!'

[[banned]]
name = "we, our or us at most once"
pattern = '(?is)\b(we|our|us)\b.*\b(we|our|us)\b'

[[banned]]
name = "never ask for a meeting, call, demo or calendar time"
pattern = '(?i)\b(a call|meeting|calendar|demo|schedule a|book a)\b'

[[banned]]
name = "no dollar figures other than the settlement story"
pattern = '\$\s?(?!1\.4M)\d'

[[banned]]
name = "no percentages"
pattern = '\d\s?%'

[[banned]]
name = "FORBIDDEN proof point: INEOS"
pattern = '(?i)\bINEOS\b'

[[banned]]
name = "never name Russel Metals"
pattern = '(?i)\bRussel'

[[banned]]
name = "no ALL CAPS shouting"
pattern = '(?-i:\b[A-Z]{6,}\b)'
