# TFP copy test (TFP-COPY-SPEC.md angles A5, A7, A10; A4 dropped 2026-10-15, only 27 percent of fits have any safety hook and about half of those are noise).
# One campaign per angle, every vertical in every campaign, contacts dealt at random. Campaign 2103 is the model campaign and carries A5; the A7 and A10
# campaigns are duplicates of it.

[angles]
A5  = "Load Type Fit"
A7  = "Not Your Driver, Still Your Liability"
A10 = "Peer Proof"

[segments]
Manufacturing = ["Steel, Metals and Metal Fabrication", "Machinery and Equipment Manufacturing", "General Manufacturing and Industrial Products", "Automotive and Transportation Equipment", "Defense and Aerospace Manufacturing", "Consumer and Medical Products Manufacturing"]
Materials     = ["Building Materials and Products", "Construction and Infrastructure", "Mining, Oil, Gas and Utilities"]
Logistics     = ["Trucking and Freight Carriers", "Logistics, Warehousing and 3PL", "Maritime and Rail", "Wholesale and Distribution"]
Resources     = ["Food and Beverage Production", "Agriculture and Forestry", "Equipment Rental, Recycling and Waste"]
Other         = ["Other Industrial Shippers"]
Tier2         = ["Tier 2 - previously emailed"]

[segment_caps]
Manufacturing = 250
Materials     = 250
Logistics     = 250
Resources     = 250
Other         = 250
Tier2         = 250

[rules]
per_segment_per_campaign = 250
freeze_days = 7
decision_day = 10
positive_events = ["interested", "booked"]
random_deal_seed = "tfp-angles-1"
booked_weight = 3
min_sends_per_angle = 700
min_positive_to_decide = 3         # the winner needs this many interested or booked replies before any angle is paused

[angle_prompts]
A5  = "a5-load-type"
A7  = "a7-carrier-liability"
A10 = "a10-peer-proof"

[angle_learning]
# Lookalike angles after a day-10 winner (Emmanuel, 2026-10-19). clone_parent keeps the winner's approved proofs and rules and replaces only its angle section.
enabled = true
mode = "clone_parent"
campaign_prefix = "TFP_W1_"

[scale_gate]
# Emmanuel, 2026-10-22: the winner scales to 3,500 first; five days later Slack suggests 5,000 or more (with a button) only if it is doing well.
stage1_target = 3500
review_after_days = 5
min_sends = 1500
min_interested = 3
min_interested_per_1000 = 1.0
next_targets = [5000, 10000]
max_looks = 3

[scaling]
champion_topup = 1000
expand_verticals = 3
leads_per_new_vertical = 300

[fill]
# Copy approved by Emmanuel 2026-10-16: 1,500 per angle, 4,500 leads across the three campaigns.
target = 1500

[fit]
b2b_product_makers = ""

[angle_pitch]
A5  = "Load Type Fit: \"what you ship decides where your people stand, here is the system built for that load\""
A7  = "Carrier Liability: \"it is not your driver, but the claim follows your site\""
A10 = "Peer Proof: \"a plant like yours already put this on its trailers\""
