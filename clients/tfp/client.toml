display_name = "Truck Fall Prevention"

# EmailBison workspace 37 "Lumion" on the personal host. Key follows the client, never the deploy.
workspace_id = 93
emailbison_base = "https://personal.buzzlead.io"
emailbison_key_env = "EMAILBISON_API_KEY_TFP"

# TO CONFIRM with Emmanuel: the Slack channel the Lumion approval app posts into.
slack_channel = "#tfp-expander"

# Its own database on the shared Postgres server.
database = "tfp"

# Template: campaign 1888 "QuickEnrich Decision makers RERUN | Oct 5th", read 2026-10-08. Active,
# plain text, 3 steps, no variants. Step 1 carries PERSONALIZATION 1 and step 2 carries
# PERSONALIZATION 2. Campaigns 1991 and 1804 have plain text OFF and were skipped.
model_campaign_id = 2103
step_wait_days = 3

# ICP (spec section 2): 11 to 200 employees, US.
employee_min = 100
employee_max = 1000000
default_mode = "copy-test"

# Arm whose prompts a partial arm inherits. Spec order puts After 5PM first.
base_variant = "a10-peer-proof"

# ProductEVO's rule, verbatim: nobody is contacted again inside 60 days. Past that the tier table decides the order
# (company_funnel.tier, see app/funnel.py): 1 never contacted, then 2 (over 120 days), 3 (over 90), 4 (over 60).
recontact_days = 60

# Owner and operator first, then admissions and enrollment leaders (titles.txt order). Spec first
# run used 3 contacts per domain; raise to 5 for the scale run.
contacts_per_company = 5
verify_pool_per_company = 6
title_strategy = "ordered"
use_leadocean = true

# Spec 3.3: a title containing a buyer title is kept even if it also carries an excluded word.
include_wins = true

# The fit gate runs on NEW companies when they are sourced, not on companies we have already contacted (Emmanuel, 2026-10-09):
# their supply is limited and a gate that rejects about 40% of it would deplete it for no gain.
reuse_fit_check = true

# Copy windows from the spec (section 1): the account runs E1 at 380 to 460 and E2 under 700, the
# pipeline wants E1 300 to 500 and E2 600 to 800. The intersection is used, except that Email 2's floor is 550 (Emmanuel, 2026-10-09):
# the model lands at 570 to 597 and was rewriting up to seven times to clear 600.
email1_min_chars = 300
email1_max_chars = 500
email2_min_chars = 150
email2_max_chars = 300

fit_rule = "a US or Canadian company, about 100 or more employees, that operates a plant, yard, warehouse, terminal or supply site where its own people load or unload trucks (flatbed, conestoga or dry van), in any industry. Not a fit: outside US and Canada, government, software and services, retail storefronts, asset-light brokers, terminal-less carriers."

# Scale / kill bar. PROVISIONAL: the spec says Lumion's baseline is not in the project files.
# Replace with the measured baseline from prospects/lumion-outreach-audit/refresh-20261008.
# These MUST sit above any [[table]]: TOML puts a key after a table header inside that table.
scale_metric = "of_replies"
scale_rate = 0.05
scale_min_sends = 500
scale_min_replies = 30
scale_min_days = 7

# Lumion's own vertical priority, by win rate (spec section 2, 1,512 deals, March 2026).
# Tier A: Coding, Cyber, Dental. Tier B: Welding, HVAC, Massage. Tier C: CDL, Cosmetology.
# Flight and aviation is shelved. Declared here, never inferred.
# Countries to source in (Emmanuel, 2026-10-15: TFP is US and Canada).
countries = ["US", "CA"]
# Cheap fit screen (Emmanuel, 2026-10-15): gpt-oss is the ONLY fit judge (Emmanuel: cheaper for the long run). Measured on 112 TFP companies against Sonnet: $0.0002 vs $0.0166 per company, 90 percent agreement, 3 real fits rejected, 8 non-fits passed.
fit_screen_model = "openai/gpt-oss-120b"
fit_screen_only = true
# Research inputs per TFP-COPY-SPEC section 2: Jina home page plus up to 5 internal pages picked by these words (safety, then locations,
# then products first), capped at 25k characters, plus Serper news for the past year.
research_inputs = "jina_news"
research_max_pages = 5
research_max_chars = 25000
research_page_words = ["location", "facilit", "plant", "branch", "mill", "about", "safety", "ehs", "sustainab", "esg", "career", "product", "capabilit", "service", "logistic", "shipping", "fleet", "transport"]
# Google searches per company (Serper web search, Emmanuel 2026-10-15): snippets go next to the news and same-site hits are read with Jina.
# 1 and 2 find the safety and locations pages the link walk missed; 3 feeds the incident guard (an OSHA or fatality hit means SKIP).
research_search_fetch = 2
research_search_queries = [
    'site:{domain} (safety OR EHS OR "zero harm" OR "target zero" OR "safety program")',
    'site:{domain} (locations OR facilities OR plants OR terminals OR yards)',
    '"{company}" (OSHA citation OR fatality OR "fall from" OR injured)',
]


# TFP verticals, declared (Emmanuel, 2026-10-15: any vertical that ships with flatbeds is fair game; warehousing, construction and
# defense are open). Labels are QuickEnrich industry names; Lead Ocean uses the same names. The fit gate judges each company's own site.
verticals = [
    "Steel, Metals and Metal Fabrication",
    "Machinery and Equipment Manufacturing",
    "Building Materials and Products",
    "General Manufacturing and Industrial Products",
    "Automotive and Transportation Equipment",
    "Trucking and Freight Carriers",
    "Logistics, Warehousing and 3PL",
    "Maritime and Rail",
    "Wholesale and Distribution",
    "Construction and Infrastructure",
    "Defense and Aerospace Manufacturing",
    "Mining, Oil, Gas and Utilities",
    "Food and Beverage Production",
    "Agriculture and Forestry",
    "Equipment Rental, Recycling and Waste",
    "Consumer and Medical Products Manufacturing",
    "Other Industrial Shippers",
]

[[copy_variants]]
name = "a4-safety-page"
bet = "Safety Page vs Loading Yard"

[[copy_variants]]
name = "a5-load-type"
bet = "Load Type Fit"

[[copy_variants]]
name = "a7-carrier-liability"
bet = "Not Your Driver, Still Your Liability"

[[copy_variants]]
name = "a10-peer-proof"
bet = "Peer Proof"

